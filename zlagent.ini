[agent]
auto_detect_language = true
language = multi
max_iterations = 20
prompt_file = 

[features]
max_reflection_retries = 2
multi_agent = false
self_reflection = true
task_planning = true

[llm]
max_tokens = 8192
model = qwopus3.6-27b-v2-mtp
temperature = 0.2
url = http://127.0.0.1:1234

[local_tools]
enabled = true

[logging]
level = debug

[memory]
auto_extract_facts = true
inject_facts_to_prompt = true
long_term_enabled = true
max_messages = 50
max_sessions = 100
store_dir = .zlagent_memory

[plugins]
directory = plugins

[rag]
embedding_backend = tfidf
enabled = false
knowledge_dirs = 
min_score = 0.3
store_path = knowledge_base.json
top_k = 5

[safety]
dangerous_tool_confirmation = true
input_filter = true
path_whitelist = 
skill_content_check = true

[terminal_commands]
ask_unknown = false
confirm = 
direct = 
enabled = true
