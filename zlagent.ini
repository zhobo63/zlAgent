[agent]
auto_detect_language = true
language = multi
max_iterations = 10
prompt_file = 

[features]
max_reflection_retries = 2
multi_agent = false
self_reflection = true
task_planning = true

[llm]
max_tokens = 4096
model = google/gemma-4-12b
temperature = 0.2
url = http://127.0.0.1:1234

[local_tools]
enabled = true

[memory]
max_messages = 50

[plugins]
directory = plugins

[rag]
embedding_backend = tfidf          ; "lm_studio" or "tfidf"
enabled = false
knowledge_dirs = ; directories to ingest at startup (comma-separated)
min_score = 0.3                    ; minimum cosine similarity threshold
store_path = knowledge_base.json   ; persistence path (empty = in-memory only)
top_k = 5                          ; default number of results to return

[safety]
dangerous_tool_confirmation = true
input_filter = true
path_whitelist = 
skill_content_check = true
