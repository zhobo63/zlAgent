[agent]
auto_detect_language = true
language = multi
max_iterations = 20
prompt_file = 
user_reply_mode = off

[agent_registry]
auto_discover = true
discovery_ttl_sec = 120
register_on_start = true

[features]
max_reflection_retries = 2
multi_agent = false
self_reflection = true
task_planning = true

[llm]
max_tokens = 4096
model = ornith-1.0-35b
temperature = 0.2
url = http://127.0.0.1:1234

[local_tools]
enabled = true

[logging]
level = debug

[memory]
auto_extract_facts = true
inject_facts_to_prompt = true
long_term_enabled = true
max_messages = 50
max_sessions = 100
store_dir = .zlagent_memory

[net_agent]
heartbeat_interval_sec = 1
heartbeat_timeout_sec = 5
listen_port = 8766
ws_url = ws://127.0.0.1:8765/ws

[plugins]
directory = plugins

[rag]
embedding_backend = tfidf
enabled = false
knowledge_dirs = 
min_score = 0.3
store_path = knowledge_base.json
top_k = 5

[safety]
dangerous_tool_confirmation = true
input_filter = true
path_whitelist = 
skill_content_check = true

[security]
allowed_origins = http://localhost:8765
require_auth = false
token_file = .ws_token

[telegram]
allowed_chat_ids = 
bot_token = 
enabled = false
max_updates_per_poll = 500
poll_timeout_sec = 30

[terminal_commands]
ask_unknown = false
confirm = 
direct = 
enabled = true
