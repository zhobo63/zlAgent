; ZL Agent Configuration File
; Lines starting with ; or # are comments.

[llm]
url = http://127.0.0.1:1234
temperature = 0.2
max_tokens = 4096

[memory]
max_messages = 50

[agent]
max_iterations = 10
; Auto-detect language from source file extensions in current directory.
auto_detect_language = true
; Language: multi (default), cpp, js, ts, python, rust, go, java
language = multi
; Optional: path to an external system prompt file (.md / .txt). Overrides built-in.
prompt_file =

; ── Advanced Feature Toggles ───────────────────────────────
[features]
task_planning = true
self_reflection = true
multi_agent = false
max_reflection_retries = 2

[plugins]
directory = plugins

[local_tools]
enabled = true

; ── RAG (Retrieval Augmented Generation) ──────────────────
[rag]
enabled = false
embedding_backend = tfidf          ; "lm_studio" or "tfidf"
store_path = knowledge_base.json   ; persistence path (empty = in-memory only)
top_k = 5                          ; default number of results to return
min_score = 0.3                    ; minimum cosine similarity threshold
knowledge_dirs =                   ; directories to ingest at startup (comma-separated)

; ── Safety Settings ────────────────────────────────────────
[safety]
dangerous_tool_confirmation = true
; Comma-separated list of allowed directories (empty = no restriction)
path_whitelist =
skill_content_check = true
input_filter = true
